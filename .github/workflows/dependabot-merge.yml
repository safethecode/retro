name: Dependabot merge

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true

permissions: {}

concurrency:
  group: dependabot-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.repository == 'safethecode/retro'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      checks: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      merged_count: ${{ steps.merge.outputs.merged_count }}
    steps:
      - name: Rebase and merge verified Dependabot pull requests
        id: merge
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          workflow_deadline=$((SECONDS + 4800))

          get_main_sha() {
            gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          }

          wait_for_rebase() {
            local pr_number="$1"
            local previous_head="$2"
            local expected_base="$3"

            for ((attempt = 1; attempt <= 80; attempt++)); do
              if ((SECONDS >= workflow_deadline)); then
                return 1
              fi

              local pull_request
              local current_head
              local current_base
              if ! pull_request=$(gh api "repos/$REPOSITORY/pulls/$pr_number"); then
                return 1
              fi
              current_head=$(jq -r '.head.sha' <<< "$pull_request")
              current_base=$(jq -r '.base.sha' <<< "$pull_request")
              if [[ "$current_head" != "$previous_head" && "$current_base" == "$expected_base" ]]; then
                printf '%s\n' "$current_head"
                return 0
              fi
              sleep 15
            done

            return 1
          }

          wait_for_ci() {
            local pr_number="$1"
            local expected_head="$2"

            for ((attempt = 1; attempt <= 80; attempt++)); do
              if ((SECONDS >= workflow_deadline)); then
                return 1
              fi

              local current_head
              if ! current_head=$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '.head.sha'); then
                return 1
              fi
              if [[ "$current_head" != "$expected_head" ]]; then
                echo "Pull request #$pr_number changed from $expected_head to $current_head while waiting for CI."
                return 1
              fi

              local checks
              checks=$(gh pr checks "$pr_number" --repo "$REPOSITORY" --json name,bucket,workflow 2>/dev/null || printf '[]')

              local verify_bucket
              local e2e_bucket
              verify_bucket=$(jq -r '[.[] | select(.name == "verify" and .workflow == "CI")][-1].bucket // "pending"' <<< "$checks")
              e2e_bucket=$(jq -r '[.[] | select(.name == "e2e" and .workflow == "CI")][-1].bucket // "pending"' <<< "$checks")

              if [[ "$verify_bucket" == "pass" && "$e2e_bucket" == "pass" ]]; then
                return 0
              fi

              if [[ "$verify_bucket" != "pass" && "$verify_bucket" != "pending" ]] ||
                 [[ "$e2e_bucket" != "pass" && "$e2e_bucket" != "pending" ]]; then
                echo "Pull request #$pr_number failed CI: verify=$verify_bucket e2e=$e2e_bucket"
                return 1
              fi

              sleep 15
            done

            echo "Timed out waiting for pull request #$pr_number CI."
            return 1
          }

          wait_for_merge() {
            local pr_number="$1"
            local expected_head="$2"

            for ((attempt = 1; attempt <= 40; attempt++)); do
              if ((SECONDS >= workflow_deadline)); then
                return 1
              fi

              local pull_request
              local current_head
              local merged
              if ! pull_request=$(gh api "repos/$REPOSITORY/pulls/$pr_number"); then
                return 1
              fi
              current_head=$(jq -r '.head.sha' <<< "$pull_request")
              merged=$(jq -r '.merged' <<< "$pull_request")

              if [[ "$current_head" != "$expected_head" ]]; then
                return 1
              fi
              if [[ "$merged" == "true" ]]; then
                return 0
              fi
              sleep 15
            done

            return 1
          }

          pr_numbers=()
          while IFS= read -r pr_number; do
            pr_numbers+=("$pr_number")
          done < <(
            gh api --paginate "repos/$REPOSITORY/pulls?state=open&base=main&per_page=100" \
              --jq '.[] | select(.user.login == "dependabot[bot]") | .number'
          )

          merged_count=0
          for pr_number in "${pr_numbers[@]}"; do
            if ((SECONDS >= workflow_deadline)); then
              echo "Workflow deadline reached; leaving remaining pull requests open."
              break
            fi

            if ! main_sha=$(get_main_sha); then
              echo "Failed to read main before evaluating pull request #$pr_number."
              continue
            fi
            if ! pull_request=$(gh api "repos/$REPOSITORY/pulls/$pr_number"); then
              echo "Failed to read pull request #$pr_number."
              continue
            fi
            author=$(jq -r '.user.login' <<< "$pull_request")
            base_ref=$(jq -r '.base.ref' <<< "$pull_request")
            base_sha=$(jq -r '.base.sha' <<< "$pull_request")
            draft=$(jq -r '.draft' <<< "$pull_request")
            head_sha=$(jq -r '.head.sha' <<< "$pull_request")
            merge_state=$(jq -r '.mergeable_state // "unknown"' <<< "$pull_request")

            if [[ "$author" != "dependabot[bot]" || "$base_ref" != "main" || "$draft" != "false" ]]; then
              echo "Pull request #$pr_number is not an eligible Dependabot pull request."
              continue
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "Dry run: would evaluate pull request #$pr_number at $head_sha (state: $merge_state)."
              continue
            fi

            if [[ "$base_sha" != "$main_sha" || "$merge_state" == "behind" ]]; then
              if ! gh pr comment "$pr_number" --repo "$REPOSITORY" --body "@dependabot rebase"; then
                echo "Failed to request a rebase for pull request #$pr_number."
                continue
              fi
              if ! rebased_head=$(wait_for_rebase "$pr_number" "$head_sha" "$main_sha"); then
                echo "Timed out waiting for Dependabot to rebase pull request #$pr_number."
                continue
              fi
              head_sha="$rebased_head"
            elif [[ "$merge_state" != "clean" ]]; then
              echo "Pull request #$pr_number has merge state: $merge_state"
              continue
            fi

            if ! wait_for_ci "$pr_number" "$head_sha"; then
              continue
            fi

            if ! current_main_sha=$(get_main_sha); then
              echo "Failed to read main before merging pull request #$pr_number."
              continue
            fi
            if ! pull_request=$(gh api "repos/$REPOSITORY/pulls/$pr_number"); then
              echo "Failed to re-read pull request #$pr_number before merge."
              continue
            fi
            author=$(jq -r '.user.login' <<< "$pull_request")
            base_ref=$(jq -r '.base.ref' <<< "$pull_request")
            base_sha=$(jq -r '.base.sha' <<< "$pull_request")
            draft=$(jq -r '.draft' <<< "$pull_request")
            current_head=$(jq -r '.head.sha' <<< "$pull_request")
            merge_state=$(jq -r '.mergeable_state // "unknown"' <<< "$pull_request")

            if [[ "$author" != "dependabot[bot]" ||
                  "$base_ref" != "main" ||
                  "$base_sha" != "$current_main_sha" ||
                  "$draft" != "false" ||
                  "$current_head" != "$head_sha" ||
                  "$merge_state" != "clean" ]]; then
              echo "Pull request #$pr_number changed before merge; leaving it open."
              continue
            fi

            if ! gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch --match-head-commit "$head_sha"; then
              echo "The merge command for pull request #$pr_number returned an error; checking server state."
            fi

            if wait_for_merge "$pr_number" "$head_sha"; then
              merged_count=$((merged_count + 1))
            else
              echo "Pull request #$pr_number was not confirmed as merged."
            fi
          done

          echo "merged_count=$merged_count" >> "$GITHUB_OUTPUT"

  release:
    needs: merge
    if: github.repository == 'safethecode/retro' && needs.merge.outputs.merged_count != '0'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      dry_run: false
