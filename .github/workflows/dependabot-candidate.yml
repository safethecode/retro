name: Dependabot candidate

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  classify:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate the automatic merge policy
        id: policy
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          candidate=$(node .github/scripts/dependabot-policy.mjs classify "$ACTOR" "$BASE_REF" "$UPDATE_TYPE" "$MAINTAINER_CHANGES")
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Ensure the candidate label exists
        if: steps.policy.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh label create "dependencies:automerge"
          --repo "$GITHUB_REPOSITORY"
          --color "0E8A16"
          --description "Dependabot update eligible for CI-gated automatic merge"
          --force

      - name: Mark an eligible pull request
        if: steps.policy.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label "dependencies:automerge"

      - name: Remove eligibility after the policy changes
        if: steps.policy.outputs.candidate != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr view "$PR_URL" --json labels --jq '.labels[].name' |
            grep -Fxq "dependencies:automerge"; then
            gh pr edit "$PR_URL" --remove-label "dependencies:automerge"
          fi
